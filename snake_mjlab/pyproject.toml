[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snake_mjlab"
version = "0.1.0"
dependencies = ["mjlab>=1.1.0"]

[project.entry-points."mjlab.tasks"]
snake_mjlab = "snake_mjlab"

[tool.setuptools.packages.find]
where = ["."]
include = ["snake_mjlab*"]
